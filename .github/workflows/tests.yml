name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
jobs:
  Tests:
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - xcode_version: "26.0.1" # Swift 6.2
            runner: macos-15
          - xcode_version: "26.4.1" # Swift 6.3
            runner: macos-26
          - xcode_version: "27.0" # Swift 6.4
            runner: xcode-27
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode_version }}.app/Contents/Developer"
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Get swift version
      run: swift --version
    - uses: actions/checkout@v7
    - name: Build
      run: |
        swift build
    - name: Run Tests
      run: |
        swift test --no-parallel
      env:
        ENABLE_INTEGRATION_TESTS: 1
        IS_CI: 1
